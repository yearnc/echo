# 静态分析配置。
#
# 启用 Flutter 官方推荐规则集；`flutter analyze` 应保持零问题。
# 排除平台工程目录与构建产物，仅分析 Dart 源码。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**

linter:
  rules:
    # 项目使用单引号与 const 构造，默认规则集已覆盖；
    # 如需调整，遵循 https://dart.dev/tools/linter-rules 的说明。
